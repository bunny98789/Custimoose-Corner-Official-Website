<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custimoose Corner - Reward Unlocker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #23272a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2c2f33;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #7289da; margin-bottom: 5px; }
        p { color: #b9bbbe; font-size: 14px; margin-bottom: 25px; }
        
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-discord:hover { background-color: #4752C4; }
        
        .form-group {
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        label { display: block; margin-bottom: 8px; color: #b9bbbe; font-size: 12px; text-transform: uppercase; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #202225;
            border: 1px solid #23272a;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-verify {
            width: 100%;
            background-color: #43b581;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-verify:hover { background-color: #3ca374; }
        .user-info { margin-bottom: 15px; font-weight: bold; color: #43b581; }
    </style>
</head>
<body>

<div class="container">
    <h1>Custimoose Corner 🦌</h1>
    <p>Unlock your exclusive in-game rewards by verifying your community status!</p>

    <button id="loginBtn" class="btn-discord" onclick="loginWithDiscord()">🔗 Log In with Discord</button>

    <div id="rewardForm" class="form-group">
        <div id="welcomeMessage" class="user-info"></div>
        
        <label for="codeInput">Enter your YAGPDB Reward Code:</label>
        <input type="text" id="codeInput" placeholder="Paste hashed code here">
        
        <button class="btn-verify" onclick="verifyRewardCode()">🔓 Unlock Reward</button>
    </div>
</div>

<script>
    // ⚙️ CONFIGURATION
    const CLIENT_ID = '1547063276666621952'; 
    const REDIRECT_URI = window.location.href.split('#')[0]; 
    const SECRET_KEY = 'MooseMakers2026';
    
    let userDiscordId = ""; 

    function loginWithDiscord() {
        window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
    }

    window.onload = function() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            document.getElementById('loginBtn').style.display = 'none';
            
            fetch('https://discord.com/api/v10/users/@me', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            })
            .then(response => response.json())
            .then(data => {
                if (data.id) {
                    userDiscordId = data.id;
                    
                    document.getElementById('welcomeMessage').innerText = `Logged in as: ${data.username}`;
                    document.getElementById('rewardForm').style.display = 'block';
                    
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            })
            .catch(err => {
                console.error("Error fetching Discord profile:", err);
                alert("Failed to log in with Discord. Please try again.");
                document.getElementById('loginBtn').style.display = 'inline-block';
            });
        }
    }

    async function verifyRewardCode() {
        const providedCode = document.getElementById('codeInput').value.trim();
        
        if (!providedCode) {
            alert("Please enter a code first!");
            return;
        }

        // SHA-256 Hash algorithm matching YAGPDB hash "sha256"
        const sourceString = userDiscordId + SECRET_KEY;
        const encoder = new TextEncoder();
        const data = encoder.encode(sourceString);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        
      const hashBytes = new Uint8Array(hashBuffer);
      let binary = '';

    for (const byte of hashBytes) {
        binary += String.fromCharCode(byte);
    }

    const expectedCode = btoa(binary);

        if (providedCode === expectedCode) {
            alert("🎉 Success! Reward code verified. Enjoy your perks!");
            // ---> Add your game unlock function here <---
        } else {
            alert("❌ Invalid code! This reward code does not match your Discord account.");
        }
    }
</script>

</body>
</html>
