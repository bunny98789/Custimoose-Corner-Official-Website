<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custimoose Corner - Reward Unlocker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #23272a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2c2f33;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #7289da; margin-bottom: 5px; }
        p { color: #b9bbbe; font-size: 14px; margin-bottom: 25px; }
        
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-discord:hover { background-color: #4752C4; }
        
        .form-group {
            margin-top: 20px;
            display: none; /* Hidden until user logs in */
            text-align: left;
        }
        label { display: block; margin-bottom: 8px; color: #b9bbbe; font-size: 12px; text-transform: uppercase; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #202225;
            border: 1px solid #23272a;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-verify {
            width: 100%;
            background-color: #43b581;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-verify:hover { background-color: #3ca374; }
        .user-info { margin-bottom: 15px; font-weight: bold; color: #43b581; }
    </style>
</head>
<body>

<div class="container">
    <h1>Custimoose Corner 🦌</h1>
    <p>Unlock your exclusive in-game rewards by verifying your community status!</p>

    <!-- STEP 1: Discord Login Button -->
    <button id="loginBtn" class="btn-discord" onclick="loginWithDiscord()">🔗 Log In with Discord</button>

    <!-- STEP 2: Code Submission Form (Hidden until logged in) -->
    <div id="rewardForm" class="form-group">
        <div id="welcomeMessage" class="user-info"></div>
        
        <label for="codeInput">Enter your YAGPDB Reward Code:</label>
        <input type="text" id="codeInput" placeholder="Paste scrambled code here">
        
        <button class="btn-verify" onclick="verifyRewardCode()">🔓 Unlock Reward</button>
    </div>
</div>

<script>
    // ⚙️ CONFIGURATION - REPLACE THESE VALUES WITH YOUR OWN
    const CLIENT_ID = 'YOUR_DISCORD_BOT_CLIENT_ID'; // Get this from Discord Dev Portal
    const REDIRECT_URI = window.location.href.split('#')[0]; // Automatically uses current page URL
    const SECRET_KEY = 'MooseMakers2026'; // Must match your YAGPDB secret key exactly
    
    let userDiscordId = ""; // Will be populated automatically upon successful login

    // Redirect the player to Discord's official OAuth2 Authorization screen
    function loginWithDiscord() {
        window.location.href = `https://discord.com{CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
    }

    // Runs automatically when the script loads to check if Discord redirected the user back with a token
    window.onload = function() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            // Hide the login button and fetch user details from Discord API
            document.getElementById('loginBtn').style.display = 'none';
            
            fetch('https://discord.com', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            })
            .then(response => response.json())
            .then(data => {
                if (data.id) {
                    userDiscordId = data.id; // Store the official Discord ID securely
                    
                    // Show the hidden form and greet the player
                    document.getElementById('welcomeMessage').innerText = `Logged in as: ${data.username}#${data.discriminator || '0000'}`;
                    document.getElementById('rewardForm').style.display = 'block';
                    
                    // Clean up the URL token from the browser bar for neatness
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            })
            .catch(err => {
                console.error("Error fetching Discord profile:", err);
                alert("Failed to log in with Discord. Please try again.");
                document.getElementById('loginBtn').style.display = 'inline-block';
            });
        }
    }

    // Handles the math calculations to see if the user's generated code matches their ID
    function verifyRewardCode() {
        const providedCode = document.getElementById('codeInput').value.trim();
        
        if (!providedCode) {
            alert("Please enter a code first!");
            return;
        }

        // Mathematical Hash generation formula (Base64 Scramble)
        const expectedCode = btoa(userDiscordId + SECRET_KEY);

        if (providedCode === expectedCode) {
            alert("🎉 Success! Reward code verified. Enjoy your perks!");
            
            // ---> CALL YOUR INDIE GAME REWARD FUNCTION HERE <---
            // example: unlockSecretCharacter();
            
        } else {
            alert("❌ Invalid code! This reward code does not match your Discord account.");
        }
    }
</script>

</body>
</html>
